version: '3.8'

services:
  # -------------------------------------------------------------
  # Llama-Swap Proxy & Execution Engine
  # -------------------------------------------------------------
  llama-swap-proxy:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: llama-swap-production
    ports:
      # Exposes the single master API to your host on 8080
      - "8080:8080"
    volumes:
      # Maps your local directories into the container
      - ./models:/models:ro
      - ./config.yaml:/app/config.yaml:ro
    # Initialize the proxy server
    command: >
      --config /app/config.yaml
      --listen 0.0.0.0:8080
    restart: unless-stopped
    # Prevent Docker from arbitrarily choking the CPU
    deploy:
      resources:
        limits:
          cpus: '8.0'
